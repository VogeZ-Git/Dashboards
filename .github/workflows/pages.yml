# Publishes the Dashboards repo to GitHub Pages (replaces "Deploy from a branch").
# Commits that ONLY change repo/liqhunt_history.json (liqhunt heartbeats / trade events)
# no longer redeploy the whole site; liqhunt_lab.html reads that file live from
# raw.githubusercontent.com instead. Every other push deploys as before.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'repo/liqhunt_history.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of colliding with the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5   # GitHub caps the deploy wait at 10 min
